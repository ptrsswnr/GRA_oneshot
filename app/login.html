<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เข้าสู่ระบบ — Grant Receipt Assistant</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js" defer></script>
<script src="js/firebase-config.js" defer></script>
</head>
<body>

<main class="page-shell" style="max-width:420px;">

  <div class="section" style="text-align:center;">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="color:var(--color-accent);margin:0 auto 9px;"><path d="M14.5 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7.5z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="8.5" y1="13" x2="15.5" y2="13"></line><line x1="8.5" y1="17" x2="13" y2="17"></line></svg>
    <h1 style="font-size:28px;">เข้าสู่ระบบ</h1>
    <p class="text-body" style="text-align:center;">Grant Receipt Assistant — ผู้ช่วยตรวจสอบใบเสร็จเงินทุนวิจัย</p>
  </div>

  <div class="card">
    <div id="warningBox" class="banner banner--error" style="display:none;"></div>

    <div class="field">
      <label for="email">อีเมล</label>
      <input type="email" id="email" autocomplete="email">
    </div>
    <div class="field">
      <label for="password">รหัสผ่าน</label>
      <input type="password" id="password" autocomplete="current-password">
    </div>

    <div class="row" style="justify-content:flex-end;">
      <button type="button" class="btn btn-primary btn-md" id="loginButton">เข้าสู่ระบบ</button>
    </div>

    <p class="text-small" style="margin-top:var(--sp-3);">
      ยังไม่มีบัญชี? <a href="signup.html">สมัครสมาชิก</a>
    </p>
  </div>

</main>

<script src="js/login.js" defer></script>

</body>
</html>
